<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Hut Check-In — Daily Register</title>

<!--
  Hut Check-In — Daily Register. Single-file front end, no build step.
  Shares its CSS/JS layer with index.html (the gate app) via app-common.css
  and app-common.js — see those files rather than duplicating them here.

  There is nothing to configure. The page talks to /api on its own origin,
  served by the same Render service that served this file, and authenticates
  with an HttpOnly session cookie it cannot itself read.

  Authorisation still lives in the database, not here: every read a guard makes
  is gated on `public.is_staff()` inside a view or a SECURITY DEFINER function,
  under the identity the API binds to the transaction. See db/schema.sql.
-->

<link rel="stylesheet" href="/app-common.css">
<style>
  /* ---- compliance state badges (this page only — index.html's compliance
     UI was removed, so it no longer uses badge colors at all; the
     .badge.<state> rules still in app-common.css are orphaned leftovers from
     that removed UI, not something this page shares. The states here are the
     current daily-register set, defined only on this page) ---- */
  .badge.seen_today    { color: var(--ok); }
  .badge.expected      { color: var(--muted); }
  .badge.due_today     { color: var(--warn); }
  .badge.exempt        { color: var(--exempt); }
  .badge.breach_open   { color: var(--bad); }
  .badge.never         { color: var(--bad); }
  .badge.not_required  { color: var(--muted); }

  .card.breach_open, .card.never    { border-left: 4px solid var(--bad); }
  .card.due_today                   { border-left: 4px solid var(--warn); }

  /* ---- 30-day strip ---- */
  .stripTitle { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  .strip { line-height: 0; }
  .cell { display: inline-block; width: 10px; height: 18px; margin: 1px; border-radius: 2px; }
  .cell.ok  { background: var(--ok); }
  .cell.miss { background: var(--bad); cursor: pointer; }
  .cell.na  { background: var(--surface-2); }
  .legend { margin: 6px 0 0; font-size: 12px; line-height: 1.4; }
  .legend .cell { width: 10px; height: 12px; vertical-align: middle; margin: 0 4px 0 10px; cursor: default; }
  .legend .cell:first-child { margin-left: 0; }

  /* ---- identity and policy notes (detail panel only) ---- */
  .idline { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .idline b { color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  /* Inline editor for the ID, replacing two browser prompt() dialogs: a
     phone offers to suppress those after a couple, after which every
     later prompt silently returns nothing and "Add" appears to do nothing. */
  #panelCheckin { margin-top: 14px; }

  .idform { margin-top: 10px; display: grid; gap: 10px; }
  .idform .seg { display: flex; gap: 6px; }
  .idform .seg button {
    flex: 1; padding: 11px 8px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-weight: 650;
  }
  .idform .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #041025; }
  .idform .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .idform input.field { font-variant-numeric: tabular-nums; letter-spacing: .04em; text-transform: uppercase; }
  .idform .actions { margin: 0; }
  .idform .actions .btn { padding: 14px 12px; font-size: 15px; }

  /* Facts with the rule named, never a verdict. Amber, not red: this is
     something for the manager to weigh, not an alarm the app has raised. */
  .policy {
    margin: 14px 0 0; padding: 12px 14px;
    background: color-mix(in srgb, var(--warn) 10%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: 10px;
  }
  .policy p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--text); }
  .policy p + p { margin-top: 8px; }
</style>
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<section id="login" class="login" hidden>
  <h1>Hut Check-In — Daily Register</h1>
  <p>Guard sign-in required. This terminal shows resident data only while you are logged in.</p>
  <div id="loginError" class="alert" hidden></div>
  <form id="loginForm" autocomplete="on">
    <input id="email" class="field" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="loginBtn" class="btn" type="submit">Log in</button>
  </form>
</section>

<!-- ========================= APP ========================= -->
<div id="app" hidden>
  <header>
    <div class="bar">
      <div class="brand">
        <span id="siteName">Security Hut</span>
        <small id="guardName">&nbsp;</small>
      </div>
      <nav class="viewswitch" aria-label="App view">
        <a href="/index.html">Gate</a>
        <span aria-current="page">Daily register</span>
        <a href="/admin.html" id="adminLink" hidden>Admin</a>
      </nav>
      <span id="netState" class="net" role="status" hidden></span>
      <button class="btn ghost sm" id="logoutBtn">Log out</button>
    </div>
    <!-- The three tiles are the questions a manager asks; tapping one shows
         exactly those residents in the Check in list. Tap again for all. -->
  </header>
    <div class="stats">
      <button class="stat" type="button" data-filter="not_seen" aria-pressed="false"><b id="statNotSeen">–</b><span>Not seen</span></button>
      <button class="stat" type="button" data-filter="breach"   aria-pressed="false"><b id="statOpenBreach">–</b><span>Missed days</span></button>
      <button class="stat ok"  type="button" data-filter="seen"     aria-pressed="false"><b id="statCheckins">–</b><span>Seen today</span></button>
    </div>

  <main class="wrap">
    <div id="appError" class="alert" hidden></div>
    <div id="syncNotice" class="alert warn" hidden></div>
    <div id="healthNotice" class="alert" hidden></div>

    <!-- One list, one filter. The three tiles above are the filter; the line
         under the search box says which is on and offers the way back. The
         old Attention tab is the Breaches tile: same residents, same
         worst-first order. -->
    <section id="panelCheckin">
      <input id="q" class="field pinned" type="search" placeholder="Filter residents by name…"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <p id="filterLine" class="hint filterline" hidden></p>
      <p class="hint tight">Verify the person first. Tap a name for detail; swipe right to record the check-in.</p>
      <div id="searchResults" class="list"></div>
    </section>

    <!-- ---- resident detail ---- -->
    <div id="detail" class="detail" hidden></div>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/app-common.js"></script>
<script src="/offline.js"></script>

<script>
"use strict";

/* ========================================================================
   State
   ====================================================================== */
const state = {
  profile:   null,   // { id, full_name, role }
  userId:    null,   // the guard this session belongs to; queued events carry it
  settings:  null,   // app_settings row
  selected:  null,   // resident row shown in the detail panel
  busy:      false,
  filter:    "all",   // which tile is pressed: all | not_seen | breach | seen
  searchRows:  [],    // the last list response, refiltered client-side
  searchQuery: "",
  loaded:    false,   // false until the first list has arrived — before that, every count is unknown, not zero
  allRows:   [],      // the last full (unfiltered by name) list, for the tile counts
  // Every row we have rendered, by id. Tapping a card reads from here rather
  // than making a second round trip.
  rows:      new Map(),
};

/* ========================================================================
   Helpers
   ====================================================================== */
// $, esc(), toast(), ago() come from app-common.js. showError() too — this
// page reuses its default element id ("appError"), same as index.html.

// Plain words on the cards. A "breach" in the policy is a missed day on the
// screen; the manager's report can use the formal term.
const STATE_LABEL = {
  seen_today:   "Seen today",
  expected:     "Expected",
  due_today:    "Due today",
  exempt:       "Under 18 — not required",
  breach_open:  "Missed days",
  never:        "Not yet seen",
  not_required: "Not required",
};

function stateLabel(s) {
  return STATE_LABEL[s] || s;
}

// last_seen_on only ever counts CLOSED days (see v_resident_compliance) — a
// resident who checked in an hour ago has seen_today=true but last_seen_on
// still null, because today hasn't closed yet. seen_today is the only safe
// source for "have they presented today"; last_seen_on is history, not today.
function lastSeenText(r) {
  if (r.seen_today) return "Today";
  if (r.last_seen_on) return formatDate(r.last_seen_on);
  return "Never";
}

function formatDate(yyyy_mm_dd) {
  const d = new Date(yyyy_mm_dd + "T00:00:00");
  if (Number.isNaN(d.getTime())) return yyyy_mm_dd;
  return d.toLocaleDateString([], { day: "2-digit", month: "short" });
}

/* ========================================================================
   Rendering
   ====================================================================== */

function residentCard(r) {
  const cls = ["card", esc(r.state)];

  const bits = [];
  if (r.room_label && state.settings?.feature_buildings) bits.push(esc(r.room_label));
  bits.push(`last seen ${esc(lastSeenText(r))}`);

  // "3 missed days" says more than "Missed days"; the count is on the row.
  const n = Number(r.open_breaches || 0);
  const label = r.state === "breach_open" && n > 0 ? `${n} missed day${n === 1 ? "" : "s"}` : stateLabel(r.state);

  // The strip behind the card says what a right swipe does (see .swipe-bg).
  return `<div class="swipe">
    <span class="swipe-bg right" aria-hidden="true">Check in ✓</span>
    <button class="${cls.join(" ")}" data-id="${esc(r.id)}" type="button">
      <span class="who">
        <span class="name">${esc(r.full_name)}</span>
        <span class="meta">${bits.join(" · ")} · <span class="badge ${esc(r.state)}">${esc(label)}</span></span>
      </span>
      ${r.queued
        ? `<span class="pill queued">Queued</span>`
        : `<span class="pill ${r.seen_today ? "in" : "out"}">${r.seen_today ? "Seen today" : "Not yet"}</span>`}
    </button></div>`;
}

function renderList(container, rows, emptyMsg) {
  (rows || []).forEach((r) => state.rows.set(r.id, r));
  if (!rows || rows.length === 0) {
    container.innerHTML = `<p class="empty">${esc(emptyMsg)}</p>`;
    return;
  }
  // No cap assumed here: attention_list() deliberately returns every open
  // breach uncapped, so this list can be long on a site with a large
  // backlog. It just renders in the ordinary scrolling flow — nothing here
  // slices it down or gives it a fixed clipped height.
  container.innerHTML = withLetters(rows, !state.searchQuery && state.filter === "all");
  nudgeOnce(container);
}

// Letter separators for the full alphabetical list, so a thumb scrolling a
// long register knows where it is. Skipped for a name filter or a short list,
// where they would only add noise.
function withLetters(rows, wanted) {
  if (!wanted || rows.length < 12) return rows.map((r) => residentCard(r)).join("");
  let last = "";
  return rows.map((r) => {
    // The list is ordered by surname, so the separators follow the surname.
    const surname = r.last_name || String(r.full_name || "").trim().split(/\s+/).pop() || "";
    const letter = surname.charAt(0).toUpperCase() || "#";
    const head = letter !== last ? `<div class="letter" aria-hidden="true">${esc(letter)}</div>` : "";
    last = letter;
    return head + residentCard(r);
  }).join("");
}

// On the first three loads of this app in this browser, the first card
// slides aside to reveal the strip behind it — a demonstration of the swipe.
// Counted per app, because the gate and the register swipe for different
// things. localStorage can be unavailable (private mode); then the nudge
// simply never shows.
function nudgeOnce(container) {
  try {
    const key = "swipeNudge:register";
    const seen = Number(localStorage.getItem(key) || 0);
    if (seen >= 3) return;
    if (nudgeOnce.done) return;             // once per page load, whatever re-renders
    const first = container.querySelector("button.card");
    if (!first) return;
    nudgeOnce.done = true;
    first.classList.add("nudge");
    if (first.parentElement && first.parentElement.classList.contains("swipe")) first.parentElement.classList.add("nudge");
    localStorage.setItem(key, String(seen + 1));
  } catch (_) { /* storage blocked */ }
}

// The card the resident presents at sign-in. Shown on the detail panel only,
// never in a list: a number belongs on screen when somebody is checking it
// against a card, and at no other time.
function canEditId() {
  return !!(state.profile && (state.profile.role === "supervisor" || state.profile.role === "admin"));
}

function idLine(r) {
  const shown = r.id_number
    ? `<b>${esc(r.id_type)} ${esc(r.id_number)}</b>`
    : `<span class="hint">No ID recorded</span>`;
  const edit = canEditId()
    ? ` <button class="linkish" id="editId" type="button">${r.id_number ? "Change" : "Add"}</button>`
    : "";
  return shown + edit;
}

// The editor itself, rendered into the detail sheet on demand. Supervisors
// and admins only — and the database enforces that regardless, through the
// residents_supervisor row policy behind PATCH /api/residents/:id.
function idForm(r) {
  const type = r.id_type || "TRC";
  return `
    <form id="idForm" class="idform" autocomplete="off">
      <div class="seg" role="group" aria-label="ID type">
        <button type="button" data-type="TRC" aria-pressed="${type === "TRC"}">TRC</button>
        <button type="button" data-type="IRP" aria-pressed="${type === "IRP"}">IRP</button>
      </div>
      <input id="idNumber" class="field" type="text" placeholder="Number as printed on the card"
             value="${esc(r.id_number || "")}" maxlength="40" autocapitalize="characters"
             autocorrect="off" spellcheck="false" enterkeyhint="done" required>
      <div class="actions">
        <button class="btn primary-in" id="idSave" type="submit">Save ID</button>
        <button class="btn ghost" id="idCancel" type="button">Cancel</button>
      </div>
    </form>`;
}

// The two House Rules thresholds, stated as facts with the rule named. This
// reports; it does not decide, label, or send anything. Reaching a threshold
// is the centre manager's call to make, which is where the House Rules put it.
function policyNotes(r) {
  const notes = [];
  const nights = r.consecutive_missed || 0;
  const inWindow = r.absent_in_window || 0;
  const nightLimit = r.warn_after_consecutive_nights || 3;
  const windowLimit = r.absence_window_limit || 10;
  const windowDays = r.absence_window_days || 28;

  if (nights >= nightLimit) {
    notes.push(`${nights} consecutive nights recorded. House Rules: an absence of
      ${nightLimit} consecutive nights without explanation draws a warning letter.`);
  }
  if (inWindow >= windowLimit) {
    notes.push(`${inWindow} days absent in the last ${windowDays}. House Rules:
      ${windowLimit} days inside a ${windowDays}-day window is treated as absence
      without authorisation.`);
  } else if (inWindow >= windowLimit - 2 && inWindow > 0) {
    notes.push(`${inWindow} of ${windowLimit} days in the last ${windowDays}.`);
  }
  if (!notes.length) return "";
  return `<div class="policy">${notes.map((n) => `<p>${esc(n.replace(/\s+/g, " "))}</p>`).join("")}</div>`;
}

function renderDetail(r) {
  state.selected = r;
  if (r) state.rows.set(r.id, r);
  const el = $("detail");
  if (!r) { el.hidden = true; el.innerHTML = ""; return; }

  el.innerHTML = `
    <h2>${esc(r.full_name)}</h2>

    <div class="idline">${idLine(r)}</div>

    <div class="facts">
      <div class="fact"><span>Status</span><b class="badge ${esc(r.state)}">${esc(stateLabel(r.state))}</b></div>
      <div class="fact"><span>Today</span><b>${r.seen_today ? `Seen (${r.checkins_today}×)` : "Not yet"}</b></div>
      <div class="fact"><span>Last seen</span><b>${esc(lastSeenText(r))}</b></div>
      <div class="fact"><span>Consecutive nights</span><b>${r.consecutive_missed || 0}</b></div>
      <div class="fact"><span>Absent in ${r.absence_window_days || 28} days</span><b>${r.absent_in_window || 0}</b></div>
    </div>

    ${policyNotes(r)}

    <div class="actions">
      <button class="btn primary-in wide" id="doCheckin" type="button">Record check-in</button>
      <button class="btn ghost wide" id="closeDetail" type="button">Close</button>
    </div>

    <div class="stripTitle">Last 30 days</div>
    <div id="strip" class="strip"><span class="hint">Loading…</span></div>
    <p class="hint legend"><span class="cell ok"></span>seen <span class="cell miss"></span>missed <span class="cell na"></span>not required</p>`;
  el.hidden = false;

  $("doCheckin").onclick = () => checkin(r.id);
  $("closeDetail").onclick = () => renderDetail(null);
  const editBtn = $("editId");
  if (editBtn) editBtn.onclick = () => openIdEditor(r);

  loadStrip(r.id).then((html) => {
    if (!state.selected || state.selected.id !== r.id) return; // a newer selection already won
    const stripEl = $("strip");
    if (!stripEl) return;
    stripEl.innerHTML = html || '<span class="hint">No history yet.</span>';
  });
}

/* ========================================================================
   Data access
   ====================================================================== */

// Header tiles are counted from the list itself. The list endpoint already
// returns every resident with state, open_breaches, required_today and
// seen_today, and the three tiles are exactly the three filters applied to
// those rows — so the numbers on the tiles and the list under a pressed tile
// cannot disagree, and a page load costs the database ONE evaluation of
// v_resident_compliance rather than four (the list, attention_list(), and
// two counts). On the smallest Postgres plan that view took seven seconds a
// go on 4 Sep 2026; four of them per phone per minute is what pushed the
// instance over its memory limit. /api/checkin-summary still exists for
// anything that wants a server-side count.
function refreshSummary() {
  if (!state.loaded) return;
  const rows = state.searchQuery ? state.allRows : state.searchRows;   // counts describe the whole register, not a name filter
  const all = rows || [];
  const breaches = all.filter(FILTERS.breach).length;
  const notSeen  = all.filter(FILTERS.not_seen).length;
  const seen     = all.filter(FILTERS.seen).length;
  $("statOpenBreach").textContent = breaches;
  $("statNotSeen").textContent  = notSeen;
  $("statCheckins").textContent = seen;

  // Colour follows the number, not the tile. Zero breaches is calm, not an
  // alarm. "Not seen" is neutral while the day is young, amber once the
  // due-soon hour has passed and people are still missing.
  const pastCutoff = state.settings && Number.isFinite(state.settings.due_soon_after_hour)
    ? new Date().getHours() >= state.settings.due_soon_after_hour
    : false;
  tone($("statOpenBreach").parentElement, breaches > 0 ? "bad" : "ok");
  tone($("statNotSeen").parentElement, notSeen === 0 ? "ok" : pastCutoff ? "warn" : "neutral");
}

// The register only proves who was missed if the nightly close-out runs. If
// it stops, the register looks exactly like one where nobody was missed —
// so every terminal checks, and says so in red. Polled with the list.
async function checkHealth() {
  const h = await guarded(() => apiGet("/api/session/health"), (err) => Offline.noteFailure(err));
  const box = $("healthNotice");
  if (!h) return;
  if (h.close_out_behind) {
    const last = h.last_closed_day ? `The last day closed was ${h.last_closed_day}.` : "No day has been closed yet.";
    box.innerHTML = `<b>The nightly close-out has not run.</b> ${last} Missed days are not being recorded until it does — tell the administrator to check the <code>hut-nightly</code> job on Render.`;
    box.hidden = false;
  } else if (h.recent_failures > 0) {
    box.innerHTML = `<b>A maintenance job failed in the last two days.</b> The register is still being closed out; tell the administrator to check the <code>hut-nightly</code> job on Render.`;
    box.hidden = false;
  } else {
    box.hidden = true;
  }
}

function tone(tile, t) {
  if (!tile) return;
  tile.classList.remove("bad", "warn", "ok");
  if (t !== "neutral") tile.classList.add(t);
}

let searchToken = 0;
async function runSearch(q) {
  const token = ++searchToken;
  const box = $("searchResults");
  q = (q || "").trim();

  // Until the first list arrives the box says so, rather than sitting blank
  // in a way that reads as "nobody is on the register". Once cards are on
  // screen they stay while a newer list is fetched, so typing never flickers.
  if (!box.querySelector("button.card")) {
    box.innerHTML = '<p class="empty">Loading the register…</p>';
  }

  // Online: the server's typo-tolerant search with the compliance state
  // merged in (`compliance=1`) — and, when the box is empty, the whole
  // register, which is also the copy kept for an outage. Offline: that
  // encrypted copy, filtered here, with anything still queued laid over it
  // so a check-in recorded a minute ago is still on the card.
  let rows = null;
  if (Offline.isOnline()) {
    rows = await guarded(
      () => apiGet(`/api/residents?q=${encodeURIComponent(q)}&limit=1000&compliance=1`),
      (err) => { Offline.noteFailure(err); if (!Offline.isOutage(err)) showError("Search failed: " + err.message); },
    );
    if (token !== searchToken) return;     // a newer keystroke already won
    if (rows && !q) Offline.saveRegister("checkin", rows);
  }
  if (!rows && !Offline.isOnline()) {
    const cached = await Offline.loadRegister("checkin");
    if (token !== searchToken) return;
    if (!cached) {
      box.innerHTML = "";
      showError("Offline, and this terminal holds no copy of the register yet.");
      return;
    }
    rows = Offline.filterRows(cached.rows, q);
  }
  if (!rows) return;

  showError("");
  state.searchRows = await Offline.overlay("checkin", rows);
  state.searchQuery = q;
  if (!q) state.allRows = state.searchRows;
  state.loaded = true;
  renderSearch();
  refreshSummary();
}

// The three header tiles and the chip row are one filter, applied here to
// the rows already on screen. Client-side on purpose: the counts on the
// chips always describe the rows the current query matched, switching never
// costs a round trip, and it works offline against the cached copy. The
// tests mirror the header's own definitions (routes/checkins.js).
const FILTERS = {
  all:      () => true,
  not_seen: (r) => r.required_today && !r.seen_today,
  breach:   (r) => (r.open_breaches || 0) > 0,
  seen:     (r) => !!r.seen_today,
};
const FILTER_LABEL = { all: "everyone", not_seen: "not seen today", breach: "with missed days", seen: "seen today" };

function setFilter(name) {
  state.filter = FILTERS[name] ? name : "all";
  renderDetail(null);
  renderSearch();
}

// The Breaches view is the old Attention tab: worst first — longest run of
// consecutive missed nights, then most absent in the window, then most open
// breaches — so a manager reads the top of the list and knows who to call.
// Every other view stays alphabetical, because a guard at the window is
// looking for a name.
function orderFor(filter, rows) {
  if (filter !== "breach") return rows;
  return [...rows].sort((a, b) =>
    (b.consecutive_missed || 0) - (a.consecutive_missed || 0) ||
    (b.absent_in_window || 0) - (a.absent_in_window || 0) ||
    (b.open_breaches || 0) - (a.open_breaches || 0) ||
    String(a.full_name).localeCompare(String(b.full_name)));
}

function renderSearch() {
  const rows = state.searchRows || [];
  document.querySelectorAll(".stats button[data-filter]").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter));
  });

  const shown = orderFor(state.filter, rows.filter(FILTERS[state.filter]));
  const line = $("filterLine");

  // Nothing has arrived yet: say so. A filter applied to an empty list is
  // not "0 with open breaches", it is "not loaded", and the tile beside it
  // already shows the server's count.
  if (!state.loaded) {
    if (state.filter === "all") { line.hidden = true; line.innerHTML = ""; }
    else { line.innerHTML = `Loading ${FILTER_LABEL[state.filter]}…`; line.hidden = false; }
    $("searchResults").innerHTML = '<p class="empty">Loading the register…</p>';
    return;
  }

  if (state.filter === "all") {
    line.hidden = true;
    line.innerHTML = "";
  } else {
    line.innerHTML = `Showing ${shown.length} ${FILTER_LABEL[state.filter]}${state.filter === "breach" ? ", worst first" : ""} · <button class="linkish" type="button" id="showAll">Show everyone</button>`;
    line.hidden = false;
    $("showAll").onclick = () => setFilter("all");
  }
  const q = state.searchQuery;
  const empty = q
    ? `No resident matching “${q}”${state.filter === "all" ? "" : ` under ${FILTER_LABEL[state.filter]}`}.`
    : state.filter === "not_seen" ? "Everyone who is required today has been seen."
    : state.filter === "breach"   ? "Nobody has missed days outstanding."
    : state.filter === "seen"     ? "Nobody has been seen yet today."
    : "No residents on the register.";
  renderList($("searchResults"), shown, empty);
}

// Update the card on screen from the server's answer straight away. The
// full refresh that follows re-queries v_resident_compliance, which takes
// seconds on the live database — long enough for a guard to think the swipe
// did nothing and swipe again (and each new swipe cancelled the refresh the
// last one had started). record_checkin() returns the day's register row.
function applyCheckin(residentId, dc) {
  const r = state.rows.get(residentId);
  if (!r) return;
  r.seen_today = true;
  r.checkins_today = dc && dc.checkin_count ? dc.checkin_count : (r.checkins_today || 0) + 1;
  if (r.state !== "breach_open") r.state = "seen_today";
  renderSearch();
  refreshSummary();
}

async function checkin(residentId) {
  if (state.busy) return;
  state.busy = true;

  // With no link, or when the request itself fails to reach the server, the
  // check-in is queued on this terminal with its own timestamp and sent when
  // the link returns; the server dates it to when it happened, so a
  // presentation at 23:50 that syncs at 00:10 still satisfies the right day
  // (offline.js, migrations/010). Any other refusal is the database's.
  let row = null;
  let queue = !Offline.isOnline();
  if (!queue) {
    row = await guarded(
      () => apiPost("/api/checkins", { resident_id: residentId }),
      (err) => {
        if (Offline.isOutage(err)) { Offline.noteFailure(err); queue = true; return; }
        toast("Not recorded: " + err.message, "err");
      },
    );
  }
  if (queue) {
    const r = state.rows.get(residentId);
    try {
      await Offline.enqueue({
        kind: "checkin", resident_id: residentId, resident_name: r ? r.full_name : "",
        guard_id: state.userId, guard_name: state.profile ? state.profile.full_name : "",
      });
    } catch (err) {
      state.busy = false;
      toast("Not recorded: " + err.message, "err");
      return;
    }
    state.busy = false;
    toast(`Check-in for ${r ? r.full_name : "resident"} queued until the connection returns`, "ok");
    Offline.renderNet();
    runSearch($("q").value);
    if (state.selected && state.selected.id === residentId) renderDetail(null);
    return;
  }

  state.busy = false;
  if (!row) return;
  toast(`Check-in recorded — ${row.checkin_count > 1 ? "already seen today" : "day satisfied"}`, "ok");
  applyCheckin(residentId, row);
  runSearch($("q").value);
  // The panel's job is done once the check-in is recorded: close it so the
  // guard is straight back at the list for the next person. The toast and the
  // card's refreshed badge are the confirmation.
  if (state.selected && state.selected.id === residentId) renderDetail(null);
}

// Recording the card a resident presented. Supervisors and admins only —
// enforced by the row policy, so a guard who somehow reaches this gets a 403
// from the database rather than a hidden button being the only barrier.
function openIdEditor(r) {
  const line = document.querySelector("#detail .idline");
  if (!line || $("idForm")) return;
  line.insertAdjacentHTML("afterend", idForm(r));
  const form = $("idForm");
  let type = r.id_type || "TRC";

  form.querySelectorAll(".seg button").forEach((b) => {
    b.addEventListener("click", () => {
      type = b.dataset.type;
      form.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      $("idNumber").focus();
    });
  });
  $("idCancel").onclick = () => form.remove();
  $("idNumber").focus();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const number = $("idNumber").value.trim().toUpperCase();
    if (!number) { toast("Enter the number printed on the card", "err"); return; }
    if (!Offline.isOnline()) { toast("Recording an ID needs a connection. Try again when the pill is green.", "err"); return; }

    $("idSave").disabled = true;
    const saved = await guarded(
      () => apiPatch(`/api/residents/${r.id}`, { id_type: type, id_number: number }),
      (err) => { Offline.noteFailure(err); toast("Not saved: " + err.message, "err"); },
    );
    $("idSave").disabled = false;
    if (!saved) return;

    toast(`${type} ${number} recorded`, "ok");
    const fresh = await guarded(() => apiGet(`/api/residents/${r.id}/compliance`), () => {});
    if (fresh && state.selected && state.selected.id === r.id) renderDetail(fresh);
    runSearch($("q").value);
  });
}

// The 30-day window is anchored to public.site_today() on the server rather
// than to this terminal's clock, so the strip lines up with the register.
async function loadStrip(residentId) {
  const data = await guarded(() => apiGet(`/api/residents/${residentId}/days`), (err) => Offline.noteFailure(err));
  return (data || []).map(d =>
    `<i class="cell ${!d.required ? "na" : d.presented ? "ok" : "miss"}" data-date="${esc(d.compliance_date)}" title="${esc(d.compliance_date)}"></i>`
  ).join("");
}

/* ========================================================================
   Session
   ====================================================================== */

// One request answers "is there a session, whose is it, and what is this site
// called". A deactivated account never gets this far — the API refuses to
// issue a session for one, and revokes an existing session on the next
// request — so there is no active-profile check left to do here.
async function enterApp() {
  // A reset link always lands on the login screen, even for a terminal that
  // still holds a valid session: the person following it is trying to change
  // a password, not to be shown somebody else's app.
  if (resetTokenFromUrl()) return showLogin("");

  // A logout made offline is finished here, once the link is back, before
  // the cookie is asked who it belongs to.
  if (Offline.isOnline()) await Offline.finishLogout();

  let session;
  try {
    session = await apiGet("/api/session");
    Offline.rememberSession(session);
  } catch (err) {
    if (err.status !== 0) return showLogin(err.status === 401 ? "" : err.message);
    // The server is unreachable. A tab that was already signed in carries on
    // with the profile it last saw; the server re-checks the session the
    // moment anything is sent. A tab with no such memory cannot log in
    // offline — login is the one thing that needs the server.
    Offline.noteFailure(err);
    session = Offline.rememberedSession();
    if (!session) {
      return showLogin("Cannot reach the server, and this tab was not signed in before the connection dropped. Try again when it returns.");
    }
  }

  const { profile, settings } = session;
  state.profile = profile;
  state.userId = profile.id;
  state.settings = settings;

  $("guardName").textContent = `${profile.full_name} · ${profile.role}`;
  if (settings?.site_name) $("siteName").textContent = settings.site_name;
  $("adminLink").hidden = !(profile.role === "admin" || profile.role === "supervisor");

  $("login").hidden = true;
  $("app").hidden = false;

  $("q").focus();
  refreshSummary();
  runSearch($("q").value);
  checkHealth();
  Offline.syncNow();
  idleLock.start();
}

function showLogin(message) {
  idleLock.stop();
  state.profile = null;
  state.userId = null;
  $("app").hidden = true;
  $("login").hidden = false;
  $("loginError").hidden = !message;
  if (message) $("loginError").textContent = message;
  $("email").focus();
  // Events recorded during an outage outlive a logout on purpose. Say so on
  // the way back in, so the guard knows they are waiting rather than lost.
  if (!message) {
    Offline.list().then((items) => {
      const n = items.filter((e) => !e.rejected).length;
      if (!n || state.profile) return;
      $("loginError").textContent = `${n} event${n === 1 ? "" : "s"} recorded offline ${n === 1 ? "is" : "are"} waiting to sync. Log in to send ${n === 1 ? "it" : "them"}.`;
      $("loginError").hidden = false;
    });
  }
}

/* ========================================================================
   Wiring
   ====================================================================== */

mountLogin({ onReady: enterApp });
trackHeaderHeight();

// Ends the session from the Log out button or the idle lock. Sends whatever
// is still queued first. What cannot be sent — the link is down — stays
// encrypted on this terminal until the same guard logs in again; the copy of
// the register is cleared either way.
async function endSession(message) {
  await Offline.syncNow();
  const pending = await Offline.onLogout();
  await logout();
  $("q").value = "";
  $("searchResults").innerHTML = "";
  renderDetail(null);
  const waiting = pending
    ? `${pending} event${pending === 1 ? "" : "s"} recorded offline ${pending === 1 ? "is" : "are"} still waiting to sync. Log in again on this terminal to send ${pending === 1 ? "it" : "them"}.`
    : "";
  showLogin([message, waiting].filter(Boolean).join(" "));
}

$("logoutBtn").addEventListener("click", () => endSession(""));

// A shared terminal locks after the idle minutes set under Settings (default
// 20) — but never while the connection is down, because a guard could not
// log back in until it returned and would lose the offline register.
const idleLock = mountIdleLock({
  minutes: () => state.settings?.idle_lock_minutes,
  isActive: () => Offline.isOnline(),
  onLock: () => endSession(`Locked after ${state.settings?.idle_lock_minutes || 20} minutes without activity. Log in again.`),
});

let searchTimer;
$("q").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => runSearch(v), 220);
});

// Enter opens the top result — one-handed operation at the window.
$("q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const first = $("searchResults").querySelector("button.card");
  if (first) first.click();
});

// Card clicks are delegated so re-rendering never orphans a listener.
document.addEventListener("click", (e) => {
  const card = e.target.closest("button.card");
  if (!card) return;
  const row = state.rows.get(card.dataset.id);
  if (!row) return;
  renderDetail(row);
});

mountCardSwipe({ onRight: (id) => checkin(id) });

// A tile sets the filter; the pressed tile pressed again clears it, and so
// does "Show everyone" on the line under the search box.
document.querySelectorAll(".stats button[data-filter]").forEach((b) => {
  b.addEventListener("click", () => setFilter(b.dataset.filter === state.filter ? "all" : b.dataset.filter));
});

// Periodic refresh so a terminal left open overnight does not show stale
// counts or a stale list.
setInterval(() => { if (state.profile) runSearch($("q").value); }, 60000);
setInterval(() => { if (state.profile && Offline.isOnline()) checkHealth(); }, 300000);

// Any request that comes back 401 — an expired session, or a supervisor
// deactivating the account mid-shift — returns the terminal to the login
// screen instead of leaving a dead app on display.
setUnauthenticatedHandler(() => showLogin("Your session has ended. Log in again."));

// Offline support: the service worker keeps this page loadable with no
// connection, and the header pill, the sync notice and the periodic replay
// of queued events are wired here. See offline.js.
Offline.registerWorker();
Offline.mountUI({
  getUserId: () => state.userId,
  onSynced: (s) => {
    toast(`${s.sent} check-in${s.sent === 1 ? "" : "s"} recorded offline ${s.sent === 1 ? "has" : "have"} been sent`, "ok");
    refreshSummary();
    runSearch($("q").value);
  },
  onUnauthenticated: () => showLogin("Your session has ended. Log in again to send the events recorded offline."),
});

// Boot. enterApp() shows the login form itself if there is no session, so
// there is no separate "do I have a token" check to make first.
enterApp();
</script>
</body>
</html>
