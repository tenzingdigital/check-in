<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Hut Check-In</title>

<!--
  Hut Check-In — the gate app. No build step, no framework, no CDN.

  There is nothing to configure. The page talks to /api on its own origin,
  served by the same Render service that served this file, and authenticates
  with an HttpOnly session cookie it cannot itself read.

  Authorisation still lives in the database, not here: every read a guard makes
  is gated on `public.is_staff()` inside a view or a SECURITY DEFINER function,
  under the identity the API binds to the transaction. See db/schema.sql.
-->

<link rel="stylesheet" href="/app-common.css">
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<section id="login" class="login" hidden>
  <h1>Hut Check-In</h1>
  <p>Guard sign-in required. This terminal shows resident data only while you are logged in.</p>
  <div id="loginError" class="alert" hidden></div>
  <form id="loginForm" autocomplete="on">
    <input id="email" class="field" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="loginBtn" class="btn" type="submit">Log in</button>
  </form>
</section>

<!-- ========================= APP ========================= -->
<div id="app" hidden>
  <header>
    <div class="bar">
      <div class="brand">
        <span id="siteName">Security Hut</span>
        <small id="guardName">&nbsp;</small>
      </div>
      <span class="clock" id="clock"></span>
      <button class="btn ghost" id="logoutBtn" style="padding:8px 12px">Log out</button>
    </div>
    <div class="stats">
      <div class="stat ok"> <b id="statOnSite">–</b><span>On site</span></div>
      <div class="stat">    <b id="statToday">–</b><span>Today</span></div>
    </div>
  </header>

  <main class="wrap">
    <div id="appError" class="alert" hidden></div>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tabSearch" aria-selected="true"  aria-controls="panelSearch">Search</button>
      <button role="tab" id="tabLog"    aria-selected="false" aria-controls="panelLog">Log</button>
    </nav>

    <!-- ---- search ---- -->
    <section id="panelSearch" role="tabpanel" aria-labelledby="tabSearch">
      <input id="q" class="field" type="search" placeholder="Search resident by name or room…"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <p class="hint" style="margin:8px 2px 0">Verify the person in front of you against the register before signing them in.</p>
      <div id="searchResults" class="list"></div>
      <div id="detail" class="detail" hidden></div>
    </section>

    <!-- ---- log ---- -->
    <section id="panelLog" role="tabpanel" aria-labelledby="tabLog" hidden>
      <div class="row">
        <input id="logDate" class="field" type="date" style="flex:1">
        <button class="btn ghost" id="logToday">Today</button>
      </div>
      <p class="hint" style="margin:8px 2px 0" id="logCount"></p>
      <div id="logList" class="list"></div>
    </section>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/app-common.js"></script>

<script>
"use strict";

/* ========================================================================
   State
   ====================================================================== */
const state = {
  profile:  null,   // { full_name, role }
  settings: null,   // app_settings row
  selected: null,   // resident status row shown in the detail panel
  tab:      "search",
  busy:     false,
  // Every row we have rendered, by id. Tapping a card reads from here rather
  // than making a second round trip.
  rows:     new Map(),
};

/* ========================================================================
   Helpers
   ====================================================================== */
// $, esc(), toast(), showError(), ago() come from app-common.js.

function timeOfDay(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}

function todayISODate() {
  const n = new Date();
  const p = (v) => String(v).padStart(2, "0");
  return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
}

/* ========================================================================
   Rendering
   ====================================================================== */

function residentCard(r, { clickable = true } = {}) {
  const tag = clickable ? "button" : "div";
  const cls = ["card"].join(" ");
  const bits = [];
  if (r.room_ref) bits.push(esc(r.room_ref));
  bits.push(`age ${r.age_years}`);
  bits.push(r.last_event_at ? `last movement ${ago(r.last_event_at)}` : "no movement on record");

  return `
    <${tag} class="${cls}" ${clickable ? `data-id="${esc(r.id)}" type="button"` : ""}>
      <span class="who">
        <span class="name">${esc(r.full_name)}</span>
        <span class="meta">${bits.join(" · ")}</span>
      </span>
      <span class="pill ${r.presence === "in" ? "in" : "out"}">${r.presence === "in" ? "On site" : "Off site"}</span>
    </${tag}>`;
}

function renderList(container, rows, emptyMsg) {
  (rows || []).forEach((r) => state.rows.set(r.id, r));
  if (!rows || rows.length === 0) {
    container.innerHTML = `<p class="empty">${esc(emptyMsg)}</p>`;
    return;
  }
  container.innerHTML = rows.map((r) => residentCard(r)).join("");
}

function renderDetail(r) {
  state.selected = r;
  if (r) state.rows.set(r.id, r);
  const el = $("detail");
  if (!r) { el.hidden = true; el.innerHTML = ""; return; }

  const isIn = r.presence === "in";

  el.innerHTML = `
    <h2>${esc(r.full_name)}</h2>
    <div class="sub">${r.room_ref ? esc(r.room_ref) + " · " : ""}age ${r.age_years}${r.note ? " · " + esc(r.note) : ""}</div>

    <div class="facts">
      <div class="fact"><span>Status</span><b>${isIn ? "On site" : "Off site"}</b></div>
      <div class="fact"><span>Last check-in</span><b>${r.last_event_at ? esc(ago(r.last_event_at)) : "No movement on record"}</b></div>
    </div>

    <div class="actions">
      <button class="btn ${isIn ? "" : "primary-in"}"  id="doIn"  type="button">Sign IN</button>
      <button class="btn ${isIn ? "primary-out" : ""}" id="doOut" type="button">Sign OUT</button>
      <button class="btn ghost wide" id="closeDetail" type="button">Close</button>
    </div>`;
  el.hidden = false;

  $("doIn").onclick  = () => record(r.id, "in");
  $("doOut").onclick = () => record(r.id, "out");
  $("closeDetail").onclick = () => { renderDetail(null); $("q").focus(); };
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderLog(rows) {
  const list = $("logList");
  $("logCount").textContent = rows.length
    ? `${rows.length} event${rows.length === 1 ? "" : "s"}`
    : "";
  if (!rows.length) {
    list.innerHTML = `<p class="empty">No movements recorded for this date.</p>`;
    return;
  }
  list.innerHTML = rows.map((e) => `
    <div class="logrow">
      <time datetime="${esc(e.occurred_at)}">${esc(timeOfDay(e.occurred_at))}</time>
      <span class="dir ${e.direction === "in" ? "in" : "out"}">${e.direction === "in" ? "IN" : "OUT"}</span>
      <span class="body">
        ${esc(e.resident_name)}${e.room_ref ? ` <span class="hint">(${esc(e.room_ref)})</span>` : ""}
        <span class="by">by ${esc(e.guard_name)}${e.note ? " · " + esc(e.note) : ""}</span>
      </span>
    </div>`).join("");
}

/* ========================================================================
   Data access
   ====================================================================== */

async function refreshSummary() {
  // Header counts are non-critical: a failure here leaves the previous numbers
  // on screen rather than interrupting a guard mid-search. A 401 is the one
  // exception and is handled centrally by guarded().
  const summary = await guarded(() => apiGet("/api/summary"), () => {});
  if (!summary) return;
  $("statOnSite").textContent = summary.on_site;
  $("statToday").textContent  = summary.events_today;
}

let searchToken = 0;
async function runSearch(q) {
  const token = ++searchToken;
  const box = $("searchResults");

  if (!q || q.trim().length < 2) {
    box.innerHTML = "";
    return;
  }

  const rows = await guarded(
    () => apiGet(`/api/residents?q=${encodeURIComponent(q.trim())}&limit=20`),
    (err) => showError("Search failed: " + err.message),
  );
  if (token !== searchToken) return;       // a newer keystroke already won
  if (!rows) return;

  showError("");
  renderList(box, rows, `No resident matching “${q.trim()}”.`);
}

async function record(residentId, direction) {
  if (state.busy) return;
  state.busy = true;
  document.querySelectorAll("#detail .btn").forEach((b) => (b.disabled = true));

  const row = await guarded(
    () => apiPost("/api/gate-events", { resident_id: residentId, direction, note: null }),
    (err) => {
      toast("Not recorded: " + err.message, "err");
      document.querySelectorAll("#detail .btn").forEach((b) => (b.disabled = false));
    },
  );

  state.busy = false;
  if (!row) return;

  toast(`${row.full_name} signed ${direction.toUpperCase()}`, "ok");
  renderDetail(row);
  refreshSummary();
  if ($("q").value.trim().length >= 2) runSearch($("q").value);
}

// The day window is now computed server-side from app_settings.local_timezone
// rather than from this terminal's clock, so a machine with a mis-set timezone
// can no longer shift what "today's log" means. dayBounds() went with it.
async function loadLog(dateStr) {
  const rows = await guarded(
    () => apiGet(`/api/gate-events?date=${encodeURIComponent(dateStr)}`),
    (err) => showError("Could not load the log: " + err.message),
  );
  if (!rows) return;
  showError("");
  renderLog(rows);
}

/* ========================================================================
   Tabs
   ====================================================================== */
function selectTab(name) {
  state.tab = name;
  for (const t of ["search", "log"]) {
    const cap = t[0].toUpperCase() + t.slice(1);
    $("tab" + cap).setAttribute("aria-selected", String(t === name));
    $("panel" + cap).hidden = t !== name;
  }
  if (name === "search") $("q").focus();
  if (name === "log")    loadLog($("logDate").value || todayISODate());
}

/* ========================================================================
   Session
   ====================================================================== */

// One request answers "is there a session, whose is it, and what is this site
// called". A deactivated account never gets this far — the API refuses to
// issue a session for one, and revokes an existing session on the next
// request — so there is no active-profile check left to do here.
async function enterApp() {
  let session;
  try {
    session = await apiGet("/api/session");
  } catch (err) {
    return showLogin(err.status === 401 ? "" : err.message);
  }

  const { profile, settings } = session;
  state.profile = profile;
  state.settings = settings;

  $("guardName").textContent = `${profile.full_name} · ${profile.role}`;
  if (settings?.site_name) $("siteName").textContent = settings.site_name;

  $("login").hidden = true;
  $("app").hidden = false;
  $("logDate").value = todayISODate();
  $("logDate").max = todayISODate();

  selectTab("search");
  refreshSummary();
}

function showLogin(message) {
  state.profile = null;
  $("app").hidden = true;
  $("login").hidden = false;
  $("loginError").hidden = !message;
  if (message) $("loginError").textContent = message;
  $("email").focus();
}

/* ========================================================================
   Wiring
   ====================================================================== */

mountLogin({ onReady: enterApp });

$("logoutBtn").addEventListener("click", async () => {
  await logout();
  $("q").value = "";
  $("searchResults").innerHTML = "";
  renderDetail(null);
  showLogin();
});

let searchTimer;
$("q").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => runSearch(v), 220);
});

// Enter opens the top result — one-handed operation at the window.
$("q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const first = $("searchResults").querySelector("button.card");
  if (first) first.click();
});

// Card clicks are delegated so re-rendering never orphans a listener.
document.addEventListener("click", (e) => {
  const card = e.target.closest("button.card");
  if (!card) return;
  const row = state.rows.get(card.dataset.id);
  if (!row) return;
  if (state.tab !== "search") selectTab("search");
  renderDetail(row);
});

$("tabSearch").addEventListener("click", () => selectTab("search"));
$("tabLog").addEventListener("click",    () => selectTab("log"));
$("logDate").addEventListener("change", (e) => loadLog(e.target.value || todayISODate()));
$("logToday").addEventListener("click", () => {
  $("logDate").value = todayISODate();
  loadLog(todayISODate());
});

// Clock in the header, plus a periodic summary refresh so a terminal left open
// overnight does not show a stale on-site count.
setInterval(() => {
  $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}, 1000);
setInterval(() => { if (state.profile) refreshSummary(); }, 60000);

// Any request that comes back 401 — an expired session, or a supervisor
// deactivating the account mid-shift — returns the terminal to the login
// screen instead of leaving a dead app on display.
setUnauthenticatedHandler(() => showLogin("Your session has ended. Log in again."));

// Boot. enterApp() shows the login form itself if there is no session, so
// there is no separate "do I have a token" check to make first.
enterApp();
</script>
</body>
</html>
