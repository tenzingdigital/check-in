<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Hut Check-In — Gate</title>

<!--
  Hut Check-In — the gate app. No build step, no framework, no CDN.

  There is nothing to configure. The page talks to /api on its own origin,
  served by the same Render service that served this file, and authenticates
  with an HttpOnly session cookie it cannot itself read.

  Authorisation still lives in the database, not here: every read a guard makes
  is gated on `public.is_staff()` inside a view or a SECURITY DEFINER function,
  under the identity the API binds to the transaction. See db/schema.sql.
-->

<link rel="stylesheet" href="/app-common.css">
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<section id="login" class="login" hidden>
  <h1>Hut Check-In — Gate</h1>
  <p>Guard sign-in required. This terminal shows resident data only while you are logged in.</p>
  <div id="loginError" class="alert" hidden></div>
  <form id="loginForm" autocomplete="on">
    <input id="email" class="field" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="loginBtn" class="btn" type="submit">Log in</button>
  </form>
</section>

<!-- ========================= APP ========================= -->
<div id="app" hidden>
  <header>
    <div class="bar">
      <div class="brand">
        <span id="siteName">Security Hut</span>
        <small id="guardName">&nbsp;</small>
      </div>
      <nav class="viewswitch" aria-label="App view">
        <span aria-current="page">Gate</span>
        <a href="/checkin.html">Daily register</a>
        <a href="/admin.html" id="adminLink" hidden>Admin</a>
      </nav>
      <span id="netState" class="net" role="status" hidden></span>
      <button class="btn ghost sm" id="logoutBtn">Log out</button>
    </div>
  </header>
    <!-- The tiles are the filter, as on the register: tap one to see those
         residents, tap it again for everyone. Counted from the list itself,
         so the numbers and the list under them cannot disagree. -->
    <div class="stats">
      <button class="stat ok" type="button" data-filter="in"    aria-pressed="false"><b id="statOnSite">–</b><span>On site</span></button>
      <button class="stat"    type="button" data-filter="out"   aria-pressed="false"><b id="statOffSite">–</b><span>Off site</span></button>
      <button class="stat"    type="button" data-filter="today" aria-pressed="false"><b id="statToday">–</b><span>Moved today</span></button>
    </div>

  <main class="wrap">
    <div id="appError" class="alert" hidden></div>
    <div id="syncNotice" class="alert warn" hidden></div>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tabSearch" aria-selected="true"  aria-controls="panelSearch">Search</button>
      <button role="tab" id="tabLog"    aria-selected="false" aria-controls="panelLog">Log</button>
    </nav>

    <!-- ---- search ---- -->
    <section id="panelSearch" role="tabpanel" aria-labelledby="tabSearch">
      <input id="q" class="field pinned" type="search" placeholder="Filter residents by name…"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <p id="filterLine" class="hint filterline" hidden></p>
      <p class="hint tight">Verify the person first. Tap a name for detail; swipe right to sign IN, left to sign OUT.</p>
      <div id="searchResults" class="list"></div>
      <div id="detail" class="detail" hidden></div>
    </section>

    <!-- ---- log ---- -->
    <section id="panelLog" role="tabpanel" aria-labelledby="tabLog" hidden>
      <div class="row">
        <input id="logDate" class="field grow" type="date">
        <button class="btn ghost" id="logToday">Today</button>
      </div>
      <p class="hint tight" id="logCount"></p>
      <div id="logList" class="list"></div>
    </section>

  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/app-common.js"></script>
<script src="/offline.js"></script>

<script>
"use strict";

/* ========================================================================
   State
   ====================================================================== */
const state = {
  profile:  null,   // { id, full_name, role }
  userId:   null,   // the guard this session belongs to; queued events carry it
  settings: null,   // app_settings row
  selected: null,   // resident status row shown in the detail panel
  tab:      "search",
  busy:     false,
  filter:   "all",  // which tile is pressed: all | in | out | today
  loaded:   false,  // the first list has arrived (or come from the offline copy)
  allRows:  null,   // the whole register as last loaded — what the tiles count
  searchRows:  [],  // the last search response, refiltered client-side
  searchQuery: "",
  // Every row we have rendered, by id. Tapping a card reads from here rather
  // than making a second round trip.
  rows:     new Map(),
};

/* ========================================================================
   Helpers
   ====================================================================== */
// $, esc(), toast(), showError(), ago() come from app-common.js.

function timeOfDay(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}

function todayISODate() {
  const n = new Date();
  const p = (v) => String(v).padStart(2, "0");
  return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
}

/* ========================================================================
   Rendering
   ====================================================================== */

function residentCard(r, { clickable = true } = {}) {
  const tag = clickable ? "button" : "div";
  const cls = ["card"].join(" ");
  const bits = [];
  bits.push(r.last_event_at ? `last movement ${ago(r.last_event_at)}` : "no movement on record");

  const card = `
    <${tag} class="${cls}" ${clickable ? `data-id="${esc(r.id)}" type="button"` : ""}>
      <span class="who">
        <span class="name">${esc(r.full_name)}</span>
        <span class="meta">${bits.join(" · ")}</span>
      </span>
      ${r.queued
        ? `<span class="pill queued">Queued · ${r.presence === "in" ? "in" : "out"}</span>`
        : `<span class="pill ${r.presence === "in" ? "in" : "out"}">${r.presence === "in" ? "On site" : "Off site"}</span>`}
    </${tag}>`;
  if (!clickable) return card;
  // The strips behind the card say what each swipe does (see .swipe-bg).
  return `<div class="swipe">
    <span class="swipe-bg right" aria-hidden="true">Sign in ✓</span>
    <span class="swipe-bg left" aria-hidden="true">Sign out</span>${card}</div>`;
}

function renderList(container, rows, emptyMsg) {
  (rows || []).forEach((r) => state.rows.set(r.id, r));
  if (!rows || rows.length === 0) {
    container.innerHTML = `<p class="empty">${esc(emptyMsg)}</p>`;
    return;
  }
  container.innerHTML = withLetters(rows, !state.searchQuery && state.filter === "all");
  nudgeOnce(container);
}

// Letter separators for the full alphabetical list, so a thumb scrolling a
// long register knows where it is. Skipped for a name filter or a short list,
// where they would only add noise.
function withLetters(rows, wanted) {
  if (!wanted || rows.length < 12) return rows.map((r) => residentCard(r)).join("");
  let last = "";
  return rows.map((r) => {
    // The list is ordered by surname, so the separators follow the surname.
    const surname = r.last_name || String(r.full_name || "").trim().split(/\s+/).pop() || "";
    const letter = surname.charAt(0).toUpperCase() || "#";
    const head = letter !== last ? `<div class="letter" aria-hidden="true">${esc(letter)}</div>` : "";
    last = letter;
    return head + residentCard(r);
  }).join("");
}

// On the first three loads of this app in this browser, the first card
// slides aside to reveal the strip behind it — a demonstration of the swipe.
// Counted per app, because the gate and the register swipe for different
// things. localStorage can be unavailable (private mode); then the nudge
// simply never shows.
function nudgeOnce(container) {
  try {
    const key = "swipeNudge:gate";
    const seen = Number(localStorage.getItem(key) || 0);
    if (seen >= 3) return;
    if (nudgeOnce.done) return;             // once per page load, whatever re-renders
    const first = container.querySelector("button.card");
    if (!first) return;
    nudgeOnce.done = true;
    first.classList.add("nudge");
    if (first.parentElement && first.parentElement.classList.contains("swipe")) first.parentElement.classList.add("nudge");
    localStorage.setItem(key, String(seen + 1));
  } catch (_) { /* storage blocked */ }
}


function renderDetail(r) {
  state.selected = r;
  if (r) state.rows.set(r.id, r);
  const el = $("detail");
  if (!r) { el.hidden = true; el.innerHTML = ""; return; }

  const isIn = r.presence === "in";

  el.innerHTML = `
    <h2>${esc(r.full_name)}</h2>

    <div class="facts">
      <div class="fact"><span>Status</span><b>${isIn ? "On site" : "Off site"}</b></div>
      <div class="fact"><span>Last movement</span><b>${r.last_event_at ? esc(ago(r.last_event_at)) : "No movement on record"}</b></div>
    </div>

    <div class="actions">
      <button class="btn ${isIn ? "current" : "primary-in"}"  id="doIn"  type="button" title="${isIn ? "Already on site" : ""}">Sign IN</button>
      <button class="btn ${isIn ? "primary-out" : "current"}" id="doOut" type="button" title="${isIn ? "" : "Already off site"}">Sign OUT</button>
      <button class="btn ghost wide" id="closeDetail" type="button">Close</button>
    </div>`;
  el.hidden = false;

  $("doIn").onclick  = () => record(r.id, "in");
  $("doOut").onclick = () => record(r.id, "out");
  $("closeDetail").onclick = () => { renderDetail(null); $("q").focus(); };
}

function renderLog(rows) {
  const list = $("logList");
  $("logCount").textContent = rows.length
    ? `${rows.length} event${rows.length === 1 ? "" : "s"}`
    : "";
  if (!rows.length) {
    list.innerHTML = `<p class="empty">No movements recorded for this date.</p>`;
    return;
  }
  list.innerHTML = rows.map((e) => `
    <div class="logrow">
      <time datetime="${esc(e.occurred_at)}">${esc(timeOfDay(e.occurred_at))}</time>
      <span class="dir ${e.kind === "in" ? "in" : "out"}">${e.kind === "in" ? "IN" : "OUT"}</span>
      <span class="body">
        ${esc(e.resident_name)}
        <span class="by">by ${esc(e.guard_name)}${e.late_entry ? " · recorded offline, synced later" : ""}</span>
      </span>
    </div>`).join("");
}

/* ========================================================================
   Data access
   ====================================================================== */

// The three tiles are the three filters applied to the whole register, so
// they are counted here from the rows rather than fetched from /api/summary:
// the numbers and the list under a pressed tile then cannot disagree, and a
// page load costs one query instead of two. (/api/summary still exists; the
// Log tab's "N events" is the count of movements, which is a different
// number from residents who moved.)
const FILTERS = {
  all:   () => true,
  in:    (r) => r.presence === "in",
  out:   (r) => r.presence !== "in",
  today: (r) => !!r.last_event_at && isToday(r.last_event_at),
};
const FILTER_LABEL = { all: "everyone", in: "on site", out: "off site", today: "who moved today" };

function isToday(iso) {
  const d = new Date(iso);
  const p = (v) => String(v).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` === todayISODate();
}

function refreshSummary() {
  if (!state.loaded) return;
  const all = state.allRows || [];
  $("statOnSite").textContent  = all.filter(FILTERS.in).length;
  $("statOffSite").textContent = all.filter(FILTERS.out).length;
  $("statToday").textContent   = all.filter(FILTERS.today).length;
}

function setFilter(name) {
  state.filter = FILTERS[name] ? name : "all";
  renderDetail(null);
  renderSearch();
}

let searchToken = 0;
async function runSearch(q) {
  const token = ++searchToken;
  q = (q || "").trim();
  const box = $("searchResults");

  // Until the first list arrives the box says so, rather than sitting blank
  // in a way that reads as "nobody is on the register". Once cards are on
  // screen they stay while a newer list is fetched, so typing never flickers.
  if (!box.querySelector("button.card")) {
    box.innerHTML = '<p class="empty">Loading the register…</p>';
  }

  // Online: the server's typo-tolerant search — and, when the box is empty,
  // the whole register, which is also the copy kept for an outage. Offline:
  // that encrypted copy, filtered here, with anything still queued laid over
  // it so a swipe made a minute ago is still on the card.
  let rows = null;
  if (Offline.isOnline()) {
    rows = await guarded(
      () => apiGet(`/api/residents?q=${encodeURIComponent(q)}&limit=1000`),
      (err) => { Offline.noteFailure(err); if (!Offline.isOutage(err)) showError("Search failed: " + err.message); },
    );
    if (token !== searchToken) return;     // a newer keystroke already won
    if (rows && !q) Offline.saveRegister("gate", rows);
  }
  if (!rows && !Offline.isOnline()) {
    const cached = await Offline.loadRegister("gate");
    if (token !== searchToken) return;
    if (!cached) {
      box.innerHTML = "";
      showError("Offline, and this terminal holds no copy of the register yet.");
      return;
    }
    rows = Offline.filterRows(cached.rows, q);
  }
  if (!rows) return;

  showError("");
  state.searchRows = await Offline.overlay("gate", rows);
  state.searchQuery = q;
  if (!q) state.allRows = state.searchRows;   // the whole register: what the tiles count
  state.loaded = true;
  renderSearch();
  refreshSummary();
}

// Re-renders the search list through the pressed tile. Filtering is
// client-side: the rows already carry `presence` and `last_event_at`, so
// pressing a tile never costs a round trip.
function renderSearch() {
  const rows = state.searchRows || [];
  document.querySelectorAll(".stats button[data-filter]").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter));
  });

  const shown = rows.filter(FILTERS[state.filter]);
  const line = $("filterLine");

  // Nothing has arrived yet: say so rather than "0 on site".
  if (!state.loaded) {
    if (state.filter === "all") { line.hidden = true; line.innerHTML = ""; }
    else { line.innerHTML = `Loading ${FILTER_LABEL[state.filter]}…`; line.hidden = false; }
    $("searchResults").innerHTML = '<p class="empty">Loading the register…</p>';
    return;
  }

  if (state.filter === "all") {
    line.hidden = true;
    line.innerHTML = "";
  } else {
    line.innerHTML = `Showing ${shown.length} ${FILTER_LABEL[state.filter]} · <button class="linkish" type="button" id="showAll">Show everyone</button>`;
    line.hidden = false;
    $("showAll").onclick = () => setFilter("all");
  }
  const q = state.searchQuery;
  const empty = q
    ? `No resident matching “${q}”${state.filter === "all" ? "" : ` ${FILTER_LABEL[state.filter]}`}.`
    : state.filter === "in"    ? "Nobody is on site."
    : state.filter === "out"   ? "Nobody is off site."
    : state.filter === "today" ? "Nobody has moved yet today."
    : "No residents on the register.";
  renderList($("searchResults"), shown, empty);
}

async function record(residentId, direction, { fromSwipe = false } = {}) {
  if (state.busy) return;
  state.busy = true;
  document.querySelectorAll("#detail .btn").forEach((b) => (b.disabled = true));

  // With no link, or when the request itself fails to reach the server, the
  // event is queued on this terminal with its own timestamp and sent when
  // the link returns (offline.js). Any other refusal is the database's and
  // is shown as such — a queue must never hide "resident is not active".
  let row = null;
  let queue = !Offline.isOnline();
  if (!queue) {
    row = await guarded(
      () => apiPost("/api/gate-events", { resident_id: residentId, direction }),
      (err) => {
        if (Offline.isOutage(err)) { Offline.noteFailure(err); queue = true; return; }
        toast("Not recorded: " + err.message, "err");
        document.querySelectorAll("#detail .btn").forEach((b) => (b.disabled = false));
      },
    );
  }
  if (queue) {
    const r = state.rows.get(residentId);
    try {
      await Offline.enqueue({
        kind: "gate", resident_id: residentId, resident_name: r ? r.full_name : "",
        direction, guard_id: state.userId, guard_name: state.profile ? state.profile.full_name : "",
      });
    } catch (err) {
      state.busy = false;
      toast("Not recorded: " + err.message, "err");
      document.querySelectorAll("#detail .btn").forEach((b) => (b.disabled = false));
      return;
    }
    state.busy = false;
    toast(`${r ? r.full_name : "Resident"} signed ${direction.toUpperCase()} — queued until the connection returns`, "ok");
    Offline.renderNet();
    renderDetail(null);
    runSearch($("q").value);
    return;
  }

  state.busy = false;
  if (!row) return;

  toast(`${row.full_name} signed ${direction.toUpperCase()}`, "ok");
  if (!fromSwipe) renderDetail(row);
  // record_check() returns the resident's new status row: put it on the
  // card now rather than after the list refresh, so the pill flips under
  // the guard's finger and nobody swipes twice.
  const current = state.rows.get(residentId);
  if (current) Object.assign(current, row);
  renderSearch();
  refreshSummary();
  runSearch($("q").value);
}

// The day window is now computed server-side from app_settings.local_timezone
// rather than from this terminal's clock, so a machine with a mis-set timezone
// can no longer shift what "today's log" means. dayBounds() went with it.
async function loadLog(dateStr) {
  const rows = await guarded(
    () => apiGet(`/api/gate-events?date=${encodeURIComponent(dateStr)}`),
    (err) => showError("Could not load the log: " + err.message),
  );
  if (!rows) return;
  showError("");
  renderLog(rows);
}

/* ========================================================================
   Tabs
   ====================================================================== */
function selectTab(name) {
  state.tab = name;
  for (const t of ["search", "log"]) {
    const cap = t[0].toUpperCase() + t.slice(1);
    $("tab" + cap).setAttribute("aria-selected", String(t === name));
    $("panel" + cap).hidden = t !== name;
  }
  if (name === "search") $("q").focus();
  if (name === "log")    loadLog($("logDate").value || todayISODate());
}

/* ========================================================================
   Session
   ====================================================================== */

// One request answers "is there a session, whose is it, and what is this site
// called". A deactivated account never gets this far — the API refuses to
// issue a session for one, and revokes an existing session on the next
// request — so there is no active-profile check left to do here.
async function enterApp() {
  // A reset link always lands on the login screen, even for a terminal that
  // still holds a valid session: the person following it is trying to change
  // a password, not to be shown somebody else's app.
  if (resetTokenFromUrl()) return showLogin("");

  // A logout made offline is finished here, once the link is back, before
  // the cookie is asked who it belongs to.
  if (Offline.isOnline()) await Offline.finishLogout();

  let session;
  try {
    session = await apiGet("/api/session");
    Offline.rememberSession(session);
  } catch (err) {
    if (err.status !== 0) return showLogin(err.status === 401 ? "" : err.message);
    // The server is unreachable. A tab that was already signed in carries on
    // with the profile it last saw; the server re-checks the session the
    // moment anything is sent. A tab with no such memory cannot log in
    // offline — login is the one thing that needs the server.
    Offline.noteFailure(err);
    session = Offline.rememberedSession();
    if (!session) {
      return showLogin("Cannot reach the server, and this tab was not signed in before the connection dropped. Try again when it returns.");
    }
  }

  const { profile, settings } = session;
  state.profile = profile;
  state.userId = profile.id;
  state.settings = settings;

  $("guardName").textContent = `${profile.full_name} · ${profile.role}`;
  if (settings?.site_name) $("siteName").textContent = settings.site_name;
  $("adminLink").hidden = !(profile.role === "admin" || profile.role === "supervisor");

  $("login").hidden = true;
  $("app").hidden = false;
  $("logDate").value = todayISODate();
  $("logDate").max = todayISODate();

  selectTab("search");
  refreshSummary();
  runSearch($("q").value);
  Offline.syncNow();
  idleLock.start();
}

function showLogin(message) {
  idleLock.stop();
  state.profile = null;
  state.userId = null;
  state.loaded = false;
  state.allRows = null;
  $("app").hidden = true;
  $("login").hidden = false;
  $("loginError").hidden = !message;
  if (message) $("loginError").textContent = message;
  $("email").focus();
  // Events recorded during an outage outlive a logout on purpose. Say so on
  // the way back in, so the guard knows they are waiting rather than lost.
  if (!message) {
    Offline.list().then((items) => {
      const n = items.filter((e) => !e.rejected).length;
      if (!n || state.profile) return;
      $("loginError").textContent = `${n} event${n === 1 ? "" : "s"} recorded offline ${n === 1 ? "is" : "are"} waiting to sync. Log in to send ${n === 1 ? "it" : "them"}.`;
      $("loginError").hidden = false;
    });
  }
}

/* ========================================================================
   Wiring
   ====================================================================== */

mountLogin({ onReady: enterApp });
trackHeaderHeight();

// Ends the session from the Log out button or the idle lock. Sends whatever
// is still queued first. What cannot be sent — the link is down — stays
// encrypted on this terminal until the same guard logs in again; the copy of
// the register is cleared either way.
async function endSession(message) {
  await Offline.syncNow();
  const pending = await Offline.onLogout();
  await logout();
  $("q").value = "";
  $("searchResults").innerHTML = "";
  renderDetail(null);
  const waiting = pending
    ? `${pending} event${pending === 1 ? "" : "s"} recorded offline ${pending === 1 ? "is" : "are"} still waiting to sync. Log in again on this terminal to send ${pending === 1 ? "it" : "them"}.`
    : "";
  showLogin([message, waiting].filter(Boolean).join(" "));
}

$("logoutBtn").addEventListener("click", () => endSession(""));

// A shared terminal locks after the idle minutes set under Settings (default
// 20) — but never while the connection is down, because a guard could not
// log back in until it returned and would lose the offline register.
const idleLock = mountIdleLock({
  minutes: () => state.settings?.idle_lock_minutes,
  isActive: () => Offline.isOnline(),
  onLock: () => endSession(`Locked after ${state.settings?.idle_lock_minutes || 20} minutes without activity. Log in again.`),
});

let searchTimer;
$("q").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => runSearch(v), 220);
});

// Enter opens the top result — one-handed operation at the window.
$("q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const first = $("searchResults").querySelector("button.card");
  if (first) first.click();
});

// Swipe a card to record a movement without opening the panel. Direction is
// the action: right signs IN, left signs OUT, which matches arriving and
// leaving rather than making the guard remember a convention. Repeats in the
// same direction inside a minute are collapsed by record_check() in the
// database, so a double swipe is one event.
mountCardSwipe({
  onRight: (id) => record(id, "in",  { fromSwipe: true }),
  onLeft:  (id) => record(id, "out", { fromSwipe: true }),
});

// Card clicks are delegated so re-rendering never orphans a listener.
document.addEventListener("click", (e) => {
  const card = e.target.closest("button.card");
  if (!card) return;
  const row = state.rows.get(card.dataset.id);
  if (!row) return;
  if (state.tab !== "search") selectTab("search");
  renderDetail(row);
});

// A tile pressed once filters; pressed again it shows everyone.
document.querySelectorAll(".stats button[data-filter]").forEach((b) => {
  b.addEventListener("click", () => setFilter(state.filter === b.dataset.filter ? "all" : b.dataset.filter));
});

$("tabSearch").addEventListener("click", () => selectTab("search"));
$("tabLog").addEventListener("click",    () => selectTab("log"));
$("logDate").addEventListener("change", (e) => loadLog(e.target.value || todayISODate()));
$("logToday").addEventListener("click", () => {
  $("logDate").value = todayISODate();
  loadLog(todayISODate());
});

// Periodic refresh so a terminal left open overnight does not show a stale
// on-site count or a list another terminal has since changed. Only while
// online and nobody is typing a name.
setInterval(() => {
  if (state.profile && Offline.isOnline() && state.tab === "search" && !$("q").value) runSearch("");
}, 60000);

// Any request that comes back 401 — an expired session, or a supervisor
// deactivating the account mid-shift — returns the terminal to the login
// screen instead of leaving a dead app on display.
setUnauthenticatedHandler(() => showLogin("Your session has ended. Log in again."));

// Offline support: the service worker keeps this page loadable with no
// connection, and the header pill, the sync notice and the periodic replay
// of queued events are wired here. See offline.js.
Offline.registerWorker();
Offline.mountUI({
  getUserId: () => state.userId,
  onSynced: (s) => {
    toast(`${s.sent} event${s.sent === 1 ? "" : "s"} recorded offline ${s.sent === 1 ? "has" : "have"} been sent`, "ok");
    refreshSummary();
    runSearch($("q").value);
  },
  onUnauthenticated: () => showLogin("Your session has ended. Log in again to send the events recorded offline."),
});

// Boot. enterApp() shows the login form itself if there is no session, so
// there is no separate "do I have a token" check to make first.
enterApp();
</script>
</body>
</html>
