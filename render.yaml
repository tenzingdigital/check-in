# Render blueprint — the whole system.
#
#   Render dashboard → New → Blueprint → point at this repo.
#
# Three resources, all in Frankfurt so the resident data stays in the EU:
#
#   hut-db          Postgres. The register.
#   hut-check-in    Node web service. Serves public/ and /api.
#   hut-nightly     Cron job. The four maintenance functions pg_cron used to
#                   run inside Supabase.
#
# Nothing else is needed: there is no separate static site, because the web
# service serves the two front ends itself. That is deliberate — same origin
# means a first-party session cookie and no CORS, and one service is one bill,
# one deploy and one log to read.
#
# ---------------------------------------------------------------------------
# Plans and what they cost
# ---------------------------------------------------------------------------
# The plans below are the smallest ones that are honest for a hut in
# production, roughly $14/month all in. Both can be set to `free` to evaluate,
# with two consequences you must know about:
#
#   - A free Postgres instance is DELETED after 30 days. Not paused — deleted.
#     For a database that is a statutory audit trail, that is not a tier, it is
#     a countdown. Never run the real register on it.
#   - A free web service spins down after 15 minutes of inactivity and takes
#     the best part of a minute to answer the next request. A guard at 3am
#     waiting a minute for a login screen will conclude the system is broken.
#
# See docs/TECH-STACK.md for the full comparison.

databases:
  - name: hut-db
    databaseName: hut
    user: hut
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []          # private network only; no public connections

services:
  # -------------------------------------------------------------------------
  # The app
  # -------------------------------------------------------------------------
  - type: web
    name: hut-check-in
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    # The brochure site deploys separately (checksteady-site below); an edit
    # to marketing copy must not restart the app mid-shift.
    buildFilter:
      ignoredPaths:
        - site/**

    # No preDeployCommand: server.js applies migrations/*.sql itself before it
    # starts listening, so an instance never serves traffic against a schema it
    # has not applied, and the runner's advisory lock means two instances
    # coming up together during a deploy cannot race. This also works on every
    # instance type — pre-deploy commands need a paid one.

    # /healthz runs `select 1` against Postgres rather than just returning 200,
    # so an instance that has lost the database is taken out of rotation
    # instead of serving errors to guards.
    healthCheckPath: /healthz

    # The app answers on app.checksteady.com; the brochure site takes the
    # apex and www (see checksteady-site below). DNS is wired and Render is
    # already serving this domain (checked 10 Sep 2026) — this block
    # documents that, it did not create it. hut-check-in.onrender.com is
    # still the origin behind it.
    domains:
      - app.checksteady.com

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hut-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # The origin used to build links in outgoing mail. For login links and
      # the trial's verification link, the web tier falls back to the
      # request's Host header without it, which is right until something
      # sits in front of the app and it quietly is not. The Sunday weekly
      # report does not fall back at all: unset means that email carries no
      # link, by design, because it goes to several people at once and an
      # origin taken from a header is one an attacker can choose. Set it
      # once, explicitly.
      #
      # This is the Render-assigned origin. https://app.checksteady.com is
      # now live (see the domains: block below) — PUBLIC_URL is left
      # pointing at the Render origin for this pass; switching outgoing
      # email links over to the custom domain is a separate, deliberate
      # change, not a side effect of the domain clean-up that touched this
      # file.
      - key: PUBLIC_URL
        value: https://hut-check-in.onrender.com
      # 12 hours: a shift, not a fortnight. A hut terminal is a shared physical
      # device, and a session that outlives the shift is one the next person
      # inherits.
      - key: HUT_SESSION_HOURS
        value: "12"

      # The first administrator, created on an empty database at first boot.
      #
      # Without these, a fresh deploy has no accounts and nobody can log in —
      # and `node staff.js add` needs Render's Shell tab, which only exists on
      # paid instance types. `sync: false` makes Render PROMPT for the value
      # when you create the blueprint rather than storing one in this file.
      #
      # Once you have logged in, delete ADMIN_PASSWORD from the service's
      # environment. The account stays; the bootstrap only ever fires when
      # there are zero staff accounts, so it will not run again either way.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

    # Security headers are NOT set here. They live in lib/security.js, next to
    # the Content-Security-Policy hashes they are computed from — the CSP now
    # lists a SHA-256 for each inline <script> instead of allowing
    # 'unsafe-inline', and that can only be derived from the files themselves.
    # Splitting the header set across a host config and the code was how the
    # old vercel.json / render.yaml pair drifted; there is one copy now, and
    # check.sh asserts the running server actually sends it.

  # -------------------------------------------------------------------------
  # Nightly maintenance — what pg_cron used to do
  # -------------------------------------------------------------------------
  # Render's managed Postgres has no pg_cron, so the schedule moved out here.
  #
  # 00:30 UTC, chosen to fall after local midnight in Europe/Dublin so that
  # close_out_compliance_days() closes the day that has actually ended. If the
  # site's timezone is far from UTC, move this. Running early only defers rows
  # to the next run — it never writes a wrong day — and the function backfills
  # any day it missed, which is what makes an external scheduler safe here.
  #
  # THIS JOB IS NOT OPTIONAL. Without it, daily_compliance only ever gains rows
  # from record_checkin() — the positive path — so nobody is ever recorded as
  # having missed a day, and the register silently stops proving compliance.
  - type: cron
    name: hut-nightly
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "30 0 * * *"
    buildCommand: npm install
    startCommand: node jobs.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hut-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # The nightly job has no request to build a link from (jobs.js
      # reportLink()), so the Sunday weekly report link comes from here or
      # not at all — unset, the email still sends with the link left out.
      # Same Render-assigned origin as hut-check-in above; see the note
      # there about the now-live https://app.checksteady.com custom domain.
      - key: PUBLIC_URL
        value: https://hut-check-in.onrender.com

  # -------------------------------------------------------------------------
  # The brochure site (checksteady.com) — static, no build step, published
  # straight from ./site. Same pattern as the scheduler repo's
  # staffsorted-site.
  # NOTE: current Render Blueprint spec (https://render.com/docs/blueprint-spec)
  # uses `type: web` + `runtime: static` for a static site — `type: static` is
  # not a valid value. Don't "fix" this.
  - type: web
    name: checksteady-site
    runtime: static
    staticPublishPath: ./site
    # The apex and www. Both are live and served by Render already (checked
    # 10 Sep 2026: checksteady.com and www.checksteady.com both resolve,
    # through Cloudflare, to this service) — this block documents that, it
    # did not create it.
    domains:
      - checksteady.com
      - www.checksteady.com
    # The same header set the app sends (lib/security.js), for the same brand.
    # The site is static HTML with its own stylesheet and fonts and nothing
    # else, so the policy can refuse everything but those.
    #
    # form-action is the one exception: the trial sign-up form on /trial/ posts
    # to the app's origin. With the old `form-action 'none'` the browser blocks
    # that submit SILENTLY — no console error, the button simply does nothing —
    # so the app origin is named here explicitly and nowhere else is allowed.
    #
    # script-src and connect-src are the other exceptions.
    #
    # https://static.cloudflareinsights.com is for the Cloudflare Web
    # Analytics beacon (tools/build-site.py, CF_BEACON_TOKEN): the beacon
    # loads from there and reports to cloudflareinsights.com (connect-src),
    # and it cannot do either without these even before a token is set.
    # Turning analytics on is then one constant in one file, not a CSP change
    # and a page change together.
    #
    # 'self' is for site/trial-submit.js, the only other <script> the site
    # ever serves (see tools/build-site.py's docstring): it disables the
    # trial form's submit button and relabels it while the POST is in
    # flight, so a slow connection reads as "sending" rather than "nothing
    # happened" (10 Sep 2026). It is loaded only by /trial/, but this header
    # applies to every path Render can match here, so the allowance is
    # site-wide even though the <script> tag itself is not.
    #
    # No 'unsafe-inline' anywhere — both exceptions are external, deferred
    # files with no inline code — and nothing else here is loosened.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com; connect-src https://cloudflareinsights.com; base-uri 'none'; form-action 'self' https://app.checksteady.com; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
    buildFilter:
      paths:
        - site/**
        - render.yaml
